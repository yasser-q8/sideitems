<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Side Items By Agent - شركة نايف للأغذية</title>
<link rel="icon" href="https://i.postimg.cc/NM2zJWZD/NAIF-LOGO.jpg" type="image/jpeg">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<style>
    :root{
        --red:#C8102E;
        --red-dark:#9B0C23;
        --red-soft:#fdecef;
        --ink:#1f2937;
        --muted:#6b7280;
        --line:#e5e7eb;
        --line-soft:#f1f2f4;
        --bg:#f4f5f7;
        --card:#ffffff;
        --ok:#10b981;
    }
    *{box-sizing:border-box;}
    html{scroll-behavior:smooth;}
    body{
        margin:0;
        background:var(--bg);
        color:var(--ink);
        font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        direction:rtl;
        padding:24px 16px 140px;
        -webkit-font-smoothing:antialiased;
        min-height:100vh;
    }

    /* ===================== شريط الأدوات ===================== */
    .toolbar{
        max-width:1100px;
        margin:0 auto 20px;
        display:flex;
        flex-wrap:wrap;
        align-items:center;
        gap:10px;
        background:var(--card);
        padding:12px 14px;
        border-radius:14px;
        box-shadow:0 4px 18px rgba(0,0,0,.06);
        border:1px solid var(--line);
    }
    .toolbar-section{display:flex; align-items:center; gap:8px;}
    .toolbar-divider{width:1px; height:36px; background:var(--line); margin:0 4px;}

    .btn{
        display:inline-flex; align-items:center; gap:8px;
        border:none; border-radius:10px; cursor:pointer;
        padding:13px 24px; font-size:.95rem; font-weight:800;
        font-family:inherit; transition:.2s ease;
        white-space:nowrap;
        letter-spacing:.2px;
    }
    .btn:disabled{opacity:.55; cursor:not-allowed; transform:none !important;}
    .btn-pdf{background:#1f2937; color:#fff; box-shadow:0 4px 14px rgba(31,41,55,.28);}
    .btn-pdf:hover:not(:disabled){background:#111827; transform:translateY(-2px);}
    .btn-xls{background:#107C41; color:#fff; box-shadow:0 4px 14px rgba(16,124,65,.28);}
    .btn-xls:hover:not(:disabled){background:#0c5e31; transform:translateY(-2px);}
    .btn .btn-emoji{font-size:1.15rem; line-height:1;}

    .file-btn{
        display:inline-flex; align-items:center; gap:8px;
        background:var(--red); color:#fff;
        border:none; border-radius:10px; cursor:pointer;
        padding:13px 22px; font-size:.95rem; font-weight:800;
        font-family:inherit; transition:.2s ease;
        box-shadow:0 4px 14px rgba(200,16,46,.28);
        white-space:nowrap;
    }
    .file-btn:hover{background:var(--red-dark); transform:translateY(-2px);}
    .file-btn .icon{font-size:1.15rem; line-height:1;}

    .segmented{display:inline-flex; background:#f1f2f4; border-radius:10px; padding:3px; gap:2px;}
    .segmented label{cursor:pointer; position:relative;}
    .segmented input{display:none;}
    .segmented span{
        display:block; padding:8px 16px; border-radius:8px;
        font-size:.82rem; font-weight:700; color:var(--muted);
        transition:all .18s ease; white-space:nowrap;
    }
    .segmented input:checked + span{
        background:#fff; color:var(--red);
        box-shadow:0 1px 3px rgba(0,0,0,.1);
    }

    .orientation-btn{
        display:inline-flex; align-items:center; gap:8px;
        background:#fff; color:var(--ink);
        border:1px solid var(--line); border-radius:10px;
        padding:12px 16px; font-size:.84rem; font-weight:700;
        font-family:inherit; cursor:pointer;
        transition:.2s ease; white-space:nowrap;
    }
    .orientation-btn:hover{border-color:var(--red); color:var(--red); background:#fffafa;}
    .orientation-btn .ori-icon{font-size:1.05rem; display:inline-block; transition:transform .3s ease;}
    .orientation-btn:hover .ori-icon{transform:rotate(180deg);}

    /* ===================== البطاقة الأساسية ===================== */
    .report{
        max-width:1100px; margin:0 auto; background:var(--card);
        border:1px solid #eceef1; border-radius:16px;
        box-shadow:0 10px 34px rgba(0,0,0,.07);
        padding:26px 28px 30px;
    }

    .report-head{
        display:flex; justify-content:space-between; align-items:flex-start;
        gap:20px; padding-bottom:16px; border-bottom:3px solid var(--red);
    }
    .brand{display:flex; align-items:center; gap:16px;}
    .brand img{
        width:80px; height:80px; object-fit:contain;
        border:1px solid #eee; border-radius:12px;
        background:#fff; padding:5px; display:block;
    }
    .brand h1{margin:0; font-size:1.2rem; color:var(--red); font-weight:800;}
    .brand p{margin:4px 0 0; font-size:.76rem; color:var(--muted); direction:ltr; letter-spacing:.4px;}
    .meta{text-align:left; direction:ltr; font-size:.74rem; color:var(--muted); line-height:1.7;}
    .meta .title{font-size:.98rem; font-weight:800; color:var(--ink); margin-bottom:3px;}

    /* ===================== الجدول ===================== */
    .table-wrap{
        margin-top:16px;
        overflow-x:auto; overflow-y:visible;
        border:1px solid var(--line); border-radius:11px;
        background:#fff; max-height:none;
    }

    table.report-table{
        border-collapse:separate; border-spacing:0;
        width:max-content; min-width:100%;
        font-size:0.76rem; direction:rtl;
    }

    table.report-table thead th{
        background:var(--red); color:#fff; font-weight:700;
        font-size:0.64rem; line-height:1.25;
        padding:9px 5px; text-align:center; vertical-align:bottom;
        white-space:normal; word-break:break-word;
        min-width:58px; max-width:70px;
        position:sticky; top:0; z-index:3;
        border-bottom:2px solid var(--red-dark);
        border-left:1px solid rgba(255,255,255,.15);
    }
    table.report-table thead th:first-child{border-left:none;}
    table.report-table thead th.item-header{
        position:sticky; top:0; right:0; z-index:5;
        text-align:right; direction:rtl;
        min-width:180px; max-width:180px;
        background:var(--red-dark); border-left:2px solid #fff;
        font-size:0.72rem;
    }
    table.report-table thead th.total-header{
        background:var(--red-dark); min-width:58px; max-width:58px;
    }

    table.report-table tbody td{
        padding:7px 5px; text-align:center;
        border-bottom:1px solid var(--line-soft);
        direction:ltr; font-variant-numeric:tabular-nums;
    }
    table.report-table tbody td.item-name{
        position:sticky; right:0; z-index:2;
        text-align:right; direction:ltr;
        font-weight:600; font-size:0.72rem; color:var(--ink);
        background:#fff; border-left:1px solid var(--line);
        min-width:180px; max-width:180px;
        white-space:normal; word-break:break-word; line-height:1.3;
    }
    table.report-table tbody tr:nth-child(even){background:#fafbfc;}
    table.report-table tbody tr:nth-child(even) td.item-name{background:#fafbfc;}
    table.report-table tbody tr:hover{background:#fdf1f3;}
    table.report-table tbody tr:hover td.item-name{background:#fdf1f3;}

    table.report-table tbody td.total-cell{
        font-weight:700; color:var(--red); background:#fff9fa;
    }
    table.report-table tbody tr:nth-child(even) td.total-cell{background:#fdf3f5;}

    table.report-table td.dash{color:#c3c7ce; font-weight:400;}

    table.report-table tfoot td{
        padding:10px 5px; font-weight:800; text-align:center;
        background:var(--red-soft); color:var(--red-dark);
        border-top:2px solid var(--red);
        direction:ltr; font-variant-numeric:tabular-nums;
        font-size:0.74rem;
    }
    table.report-table tfoot td.item-name{
        position:sticky; right:0; z-index:2;
        text-align:right; direction:rtl;
        background:var(--red-soft);
        border-left:2px solid var(--red);
        min-width:180px; max-width:180px;
    }
    table.report-table tfoot td.dash{color:#b9848f; font-weight:700;}

    /* الوضع المقلوب (الموظفون رأسي) */
    table.report-table.transposed thead th:not(.item-header):not(.total-header){
        min-width:72px; max-width:85px;
        font-size:0.58rem; padding:8px 4px;
    }
    table.report-table.transposed thead th.item-header{
        min-width:220px; max-width:240px;
    }
    table.report-table.transposed tbody td.item-name{
        min-width:220px; max-width:240px;
        font-size:0.68rem;
        white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    table.report-table.transposed tfoot td.item-name{
        min-width:220px; max-width:240px;
    }

    /* ===================== الحاشية والتحذيرات ===================== */
    .footnote{
        margin-top:16px; font-size:.72rem; color:var(--muted);
        border-top:1px dashed var(--line);
        padding-top:12px; line-height:1.85;
    }
    .warn{
        margin-top:14px; padding:11px 14px; border-radius:10px;
        background:#fff7ed; border:1px solid #fed7aa;
        color:#9a3412; font-size:.78rem; font-weight:600; line-height:1.7;
    }
    .warn b{color:#7c2d12;}

    .empty{
        text-align:center; padding:60px 20px; color:var(--muted);
        font-size:.9rem;
        background:linear-gradient(180deg, #fafbfc, #ffffff);
        border:1px dashed var(--line); border-radius:12px;
        margin-top:16px;
    }
    .empty .empty-icon{font-size:2.6rem; margin-bottom:12px; opacity:.4;}
    .empty b{display:block; color:var(--ink); font-size:1.02rem; margin-bottom:8px;}

    /* ============================================================
       ★★★ وضع PDF — صفحة واحدة + تكبير الأرقام فقط ★★★
       ============================================================ */

    .report.pdf-mode{
        padding: 6px 8px 8px !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        width: max-content !important;
        max-width: none !important;
    }

    .report.pdf-mode .report-head{
        padding-bottom: 4px !important;
        border-bottom: 2px solid var(--red) !important;
        gap: 8px !important;
        margin-bottom: 2px;
    }
    .report.pdf-mode .brand{gap: 6px !important;}
    .report.pdf-mode .brand img{
        width: 34px !important;
        height: 34px !important;
        padding: 2px !important;
        border-radius: 5px !important;
        border: 1px solid #eee !important;
    }
    .report.pdf-mode .brand h1{
        font-size: 0.7rem !important;
        line-height: 1.1 !important;
    }
    .report.pdf-mode .brand p{
        font-size: 0.42rem !important;
        margin-top: 1px !important;
        letter-spacing: .2px !important;
    }
    .report.pdf-mode .meta .title{
        font-size: 0.6rem !important;
        margin-bottom: 0 !important;
    }

    .report.pdf-mode .meta-line{ display: none !important; }
    .report.pdf-mode .warn{ display: none !important; }

    .report.pdf-mode .table-wrap{
        margin-top: 4px !important;
        overflow: visible !important;
        border: none !important;
        border-radius: 0 !important;
        width: auto !important;
    }

    .report.pdf-mode table.report-table{
        font-size: 0.55rem;
        width: max-content !important;
        min-width: 0 !important;
    }

    .report.pdf-mode table.report-table thead th{
        font-size: 0.46rem !important;
        padding: 2px 1px !important;
        min-width: 30px !important;
        max-width: 34px !important;
        min-height: 56px !important;
        position: static !important;
    }
    .report.pdf-mode table.report-table thead th.item-header{
        min-width: 100px !important;
        max-width: 100px !important;
        font-size: 0.5rem !important;
        text-align: right !important;
    }
    .report.pdf-mode table.report-table thead th.total-header{
        min-width: 30px !important;
        max-width: 34px !important;
    }

    .report.pdf-mode table.report-table tbody td{
        font-size: 0.55rem;
        padding: 1px 1px !important;
    }

    .report.pdf-mode table.report-table tbody td.num,
    .report.pdf-mode table.report-table tbody td.total-cell{
        font-size: 0.61rem !important;
    }

    .report.pdf-mode table.report-table tbody td.item-name{
        font-size: 0.48rem !important;
        min-width: 100px !important;
        max-width: 100px !important;
        padding: 1px 3px !important;
        position: static !important;
        white-space: nowrap !important;
        overflow: hidden !important;
        text-overflow: ellipsis !important;
    }

    .report.pdf-mode table.report-table tfoot td{
        font-size: 0.61rem !important;
        padding: 2px 1px !important;
    }
    .report.pdf-mode table.report-table tfoot td.item-name{
        min-width: 100px !important;
        max-width: 100px !important;
        font-size: 0.48rem !important;
        position: static !important;
    }

    .report.pdf-mode table.report-table.transposed thead th:not(.item-header):not(.total-header){
        min-width: 24px !important;
        max-width: 26px !important;
        font-size: 0.4rem !important;
        padding: 2px 1px !important;
        min-height: 62px !important;
    }
    .report.pdf-mode table.report-table.transposed thead th.item-header{
        min-width: 100px !important;
        max-width: 100px !important;
        font-size: 0.46rem !important;
    }
    .report.pdf-mode table.report-table.transposed thead th.total-header{
        min-width: 26px !important;
        max-width: 28px !important;
    }
    .report.pdf-mode table.report-table.transposed tbody td{
        font-size: 0.55rem;
        padding: 1px 1px !important;
    }
    .report.pdf-mode table.report-table.transposed tbody td.num,
    .report.pdf-mode table.report-table.transposed tbody td.total-cell{
        font-size: 0.61rem !important;
    }
    .report.pdf-mode table.report-table.transposed tbody td.item-name{
        min-width: 100px !important;
        max-width: 100px !important;
        font-size: 0.46rem !important;
        padding: 1px 3px !important;
    }
    .report.pdf-mode table.report-table.transposed tfoot td{
        font-size: 0.61rem !important;
    }
    .report.pdf-mode table.report-table.transposed tfoot td.item-name{
        min-width: 100px !important;
        max-width: 100px !important;
        font-size: 0.46rem !important;
    }

    .report.pdf-mode .footnote{
        font-size: 0.38rem !important;
        padding-top: 3px !important;
        margin-top: 3px !important;
        line-height: 1.3 !important;
        border-top-width: 1px !important;
    }

    /* ===================== توقيع المطور ===================== */
    .signature-card{
        position:fixed; bottom:20px; left:20px;
        background:#ffffff; color:var(--red);
        border:1.5px solid var(--red); border-radius:6.375px;
        padding:7.875px 13.125px;
        font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size:0.6rem; font-weight:600;
        z-index:1000; transition:all .25s ease;
        cursor:pointer; text-decoration:none; display:inline-block;
        box-shadow:0 4px 14px rgba(200,16,46,.12);
    }
    .signature-card:hover{transform:scale(1.04); box-shadow:0 8px 20px rgba(200,16,46,.22);}
    .signature-card .name{font-size:0.7125rem; font-weight:700; margin-bottom:3.75px;}
    .signature-card .title{font-size:0.525rem; opacity:.9; font-weight:500;}

    /* ===================== استجابة الجوال ===================== */
    @media (max-width:900px){
        .toolbar-section.export-section{
            width:100%;
            justify-content:flex-start;
        }
    }
    @media (max-width:768px){
        body{padding:16px 12px 130px;}
        .toolbar{padding:10px;}
        .toolbar-divider{display:none;}
        .signature-card{position:relative; bottom:auto; left:auto; margin:24px auto 0; width:fit-content;}
        .signature-card:hover{transform:none;}
        .report{padding:18px 14px;}
        .report-head{flex-direction:column;}
        .meta{text-align:right; direction:ltr;}
        .brand img{width:66px; height:66px;}
        .btn{padding:11px 18px; font-size:.88rem;}
        .file-btn{padding:11px 18px; font-size:.88rem;}
    }
    @media (max-width:480px){
        .segmented span{padding:6px 10px; font-size:.72rem;}
        .orientation-btn{padding:8px 10px; font-size:.72rem;}
        .btn{padding:10px 14px; font-size:.82rem;}
        .file-btn{padding:10px 14px; font-size:.82rem;}
    }

    @media print{
        body{background:#fff; padding:0;}
        .toolbar, .signature-card{display:none !important;}
        .report{box-shadow:none; border:none; max-width:100%;}
    }
</style>
</head>
<body>

<!-- ===== شريط الأدوات ===== -->
<div class="toolbar">
    <div class="toolbar-section export-section">

<!-- ===== منطقة التقرير ===== -->
<div class="report" id="reportArea">

<!-- ===== توقيع المطور ===== -->
<a href="https://yasser-q8.github.io/myprofile/#" class="signature-card" target="_blank" rel="noopener noreferrer">

<script>
/* =========================================================
   الشعار
   ========================================================= */
const LOGO_URL = 'https://i.postimg.cc/NM2zJWZD/NAIF-LOGO.jpg';
const FALLBACK_LOGO_SVG = `
<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
    <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#C8102E"/>
            <stop offset="100%" stop-color="#9B0C23"/>
        </linearGradient>
    </defs>
    <rect width="160" height="160" rx="16" fill="url(#g1)"/>
    <circle cx="80" cy="58" r="26" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.85"/>
    <path d="M62 58 L74 58 L78 48 L84 68 L88 58 L98 58" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="112" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">NAIF</text>
    <text x="80" y="132" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="3">FOODS</text>
</svg>`;

function setFallbackLogo(){
    document.getElementById('logo').src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(FALLBACK_LOGO_SVG);
}
function loadLogo(){
    const target = document.getElementById('logo');
    const attempt = new Image();
    attempt.crossOrigin = 'anonymous';
    attempt.onload = function(){
        try{
            const c = document.createElement('canvas');
            c.width  = attempt.naturalWidth  || 160;
            c.height = attempt.naturalHeight || 160;
            c.getContext('2d').drawImage(attempt, 0, 0);
            target.src = c.toDataURL('image/png');
        }catch(e){
            target.removeAttribute('crossorigin');
            target.src = LOGO_URL + '?v=' + Date.now();
        }
    };
    attempt.onerror = function(){
        const plain = new Image();
        plain.onload = function(){
            target.removeAttribute('crossorigin');
            target.src = LOGO_URL + '?v=' + Date.now();
        };
        plain.onerror = setFallbackLogo;
        plain.src = LOGO_URL + '?v=' + Date.now();
    };
    attempt.src = LOGO_URL;
}

/* =========================================================
   الأصناف والموظفون
   ========================================================= */

/* ★ normalize خاص بأسماء الموظفين */
function normalize(v){
    return String(v ?? '')
        .replace(/\u00A0/g, ' ')
        .trim()
        .replace(/^[-–—•\s$]+/, '')
        .replace(/[-–—•\s]+$/, '')
        .replace(/\s+/g, ' ')
        .toLowerCase();
}

/* ★★★ itemKey — مطابقة دقيقة لأسماء الأصناف ★★★
   - لا يزيل علامة $
   - يوحّد الشرطة السفلية _ إلى مسافة
   - يزيل الشرطات/النقاط من الحدود فقط
*/
function itemKey(v){
    return String(v ?? '')
        .replace(/\u00A0/g, ' ')
        .trim()
        .replace(/^[-–—•\s]+/, '')
        .replace(/[-–—•\s]+$/, '')
        .replace(/_/g, ' ')
        .replace(/\s+/g, ' ')
        .toLowerCase();
}

function toNum(v){
    if (v === null || v === undefined || v === '') return 0;
    const n = Number(String(v).replace(/,/g, '').trim());
    return isNaN(n) ? 0 : n;
}
function fmt(n){ return Number(n || 0).toLocaleString('en-US'); }
function isZero(v){ return !Number(v || 0); }
function esc(s){
    return String(s).replace(/[&<>"']/g, c => (
        {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
    ));
}
function dateStamp(){
    const d = new Date();
    const p = x => String(x).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function isDateLike(v){
    if (v instanceof Date) return true;
    const s = String(v).trim();
    if (!s) return false;
    if (/^\d{1,4}[\/\-\.]\d{1,2}[\/\-\.]\d{1,4}/.test(s)) return true;
    if (/^\d{1,2}[\s\-][A-Za-z]{3,}[\s\-]\d{4}/.test(s)) return true;
    if (/^[A-Za-z]{3,}\s+\d{1,2},?\s+\d{4}/.test(s)) return true;
    return false;
}
function getVisibleItems(){
    if (state.filterMode === 'active'){
        return ITEMS.filter(it => (state.itemTotals[it] || 0) > 0);
    }
    return ITEMS;
}

/* =========================================================
   مطابقة أسماء الموظفين (كما هي)
   ========================================================= */
const EMPLOYEE_DATA = EMPLOYEES.map(name => {
    const normalized = normalize(name);
    const words = normalized.split(' ').filter(Boolean);
    return { name, normalized, words, set: new Set(words) };
});
function findBestEmployeeMatch(cellValue){
    const n = normalize(cellValue);
    if (!n) return null;
    const nWords = n.split(' ').filter(Boolean);
    if (!nWords.length) return null;
    const nSet = new Set(nWords);

    let bestKey = null, bestScore = 0;
    for (const emp of EMPLOYEE_DATA){
        let score = 0;
        if (n === emp.normalized) score = 1000;
        else {
            const allTargetInCell = emp.words.every(w => nSet.has(w));
            const allCellInTarget = nWords.every(w => emp.set.has(w));
            if (allTargetInCell && allCellInTarget) score = 800;
            else if (allTargetInCell) score = Math.max(100, 500 - (nWords.length - emp.words.length) * 10);
            else if (allCellInTarget && nWords.length >= 2) score = Math.max(50, 300 - (emp.words.length - nWords.length) * 10);
        }
        if (score > bestScore){ bestScore = score; bestKey = emp.name; }
    }
    return bestKey;
}

/* =========================================================
   ★★★ البحث الدقيق عن أعمدة الأصناف ★★★
   - يُرجع كل الأعمدة المطابقة لكل صنف (قد يكون أكثر من عمود)
   - لا يوجد مطابقة تقريبية أو مضغوطة
   ========================================================= */
function findAllItemColumns(row){
    const result = {};
    const norm = row.map(cell => itemKey(cell));

    ITEMS.forEach(it => {
        const target = itemKey(it);
        if (!target) return;
        const cols = [];
        for (let c = 0; c < norm.length; c++){
            if (norm[c] && norm[c] === target) cols.push(c);
        }
        if (cols.length) result[it] = cols;
    });
    return result;
}

function findHeaderRow(rows){
    let best = { idx: -1, allCols: {}, score: 0 };
    for (let r = 0; r < rows.length; r++){
        const allCols = findAllItemColumns(rows[r] || []);
        const score = Object.keys(allCols).length;
        if (score > best.score){
            best = { idx: r, allCols, score };
        }
        if (score === ITEMS.length) break;
    }
    return best;
}

/* ★ عند وجود أكثر من عمود مطابق لنفس الصنف (مثل عمود بـ $ فارغ وعمود بدون $ به بيانات)
   نختار العمود الذي يحتوي على أكبر قدر من البيانات الرقمية */
function pickBestColumn(rows, headerIdx, candidates){
    if (candidates.length === 1) return candidates[0];
    let bestCol = candidates[0];
    let bestSum = -1;
    for (const c of candidates){
        let sum = 0;
        for (let r = headerIdx + 1; r < rows.length; r++){
            sum += Math.abs(toNum(rows[r][c]));
        }
        if (sum > bestSum){
            bestSum = sum;
            bestCol = c;
        }
    }
    return bestCol;
}

/* =========================================================
   تحديد عمود أسماء الموظفين (يتجاهل جميع أعمدة الأصناف)
   ========================================================= */
function detectNameColumn(rows, headerRowIdx, usedCols){
    const maxCols = Math.max(...rows.map(r => (r ? r.length : 0)), 0);

    let bestTargetCol = -1, bestTargetHits = 0;
    let bestTextCol = -1, bestTextScore = 0;

    for (let c = 0; c < maxCols; c++){
        if (usedCols.has(c)) continue;

        let targetHits = 0, textCount = 0, totalCount = 0;
        const uniqueTexts = new Set();

        for (let r = headerRowIdx + 1; r < rows.length; r++){
            const v = rows[r] ? rows[r][c] : '';
            if (v === '' || v === null || v === undefined) continue;
            const s = String(v).trim();
            if (!s) continue;
            totalCount++;
            if (isDateLike(v)) continue;
            const lower = s.toLowerCase();
            if (lower === 'total' || lower === 'grand total' || lower.startsWith('total ')) continue;
            if (!isNaN(Number(s))) continue;
            textCount++;
            uniqueTexts.add(lower);
            if (findBestEmployeeMatch(s)) targetHits++;
        }

        if (targetHits > bestTargetHits){
            bestTargetHits = targetHits;
            bestTargetCol = c;
        }
        if (textCount > 0 && totalCount > 0){
            const ratio = textCount / totalCount;
            if (ratio >= 0.4){
                const score = uniqueTexts.size * 10 + textCount;
                if (score > bestTextScore){
                    bestTextScore = score;
                    bestTextCol = c;
                }
            }
        }
    }
    return bestTargetCol !== -1 ? bestTargetCol : bestTextCol;
}

/* =========================================================
   بناء التقرير
   ========================================================= */
function buildReport(rows){
    const header = findHeaderRow(rows);
    if (header.idx === -1 || header.score === 0){
        throw new Error('لم يتم العثور على أعمدة الأصناف داخل الملف.');
    }

    /* حلّ كل صنف إلى عمود واحد (وعند التعدد نختار الأكثر بيانات) */
    const itemCols = {};
    const usedCols = new Set();
    Object.entries(header.allCols).forEach(([item, candidates]) => {
        candidates.forEach(c => usedCols.add(c));
        itemCols[item] = pickBestColumn(rows, header.idx, candidates);
    });

    const nameCol = detectNameColumn(rows, header.idx, usedCols);
    if (nameCol === -1) throw new Error('لم يتم العثور على عمود أسماء الموظفين داخل الملف.');

    const employeeRows = {};
    EMPLOYEES.forEach(emp => employeeRows[emp] = []);

    for (let r = header.idx + 1; r < rows.length; r++){
        const row = rows[r];
        if (!row) continue;
        const nameCell = row[nameCol];
        if (nameCell === undefined || nameCell === null || nameCell === '') continue;
        const s = String(nameCell).trim();
        if (!s) continue;
        const lower = s.toLowerCase();
        if (lower === 'total' || lower === 'grand total') continue;
        const matched = findBestEmployeeMatch(s);
        if (matched) employeeRows[matched].push(r);
    }

    const matrix = {};
    ITEMS.forEach(item => {
        matrix[item] = {};
        const col = itemCols[item];
        EMPLOYEES.forEach(emp => {
            let sum = 0;
            if (col !== undefined){
                employeeRows[emp].forEach(r => sum += toNum(rows[r][col]));
            }
            matrix[item][emp] = sum;
        });
    });

    const itemTotals = {};
    const empTotals = {};
    let grandTotal = 0;
    ITEMS.forEach(item => {
        itemTotals[item] = 0;
        EMPLOYEES.forEach(emp => {
            const v = matrix[item][emp] || 0;
            itemTotals[item] += v;
            empTotals[emp] = (empTotals[emp] || 0) + v;
        });
        grandTotal += itemTotals[item];
    });

    let period = '', branch = '';
    for (const row of rows){
        if (!row) continue;
        for (const cell of row){
            if (typeof cell !== 'string') continue;
            if (!period && /from\s+.+\s+to\s+/i.test(cell)) period = cell.trim();
            if (!branch && /naif\s*chicken/i.test(cell)) branch = cell.trim();
        }
    }

    state.matrix = matrix;
    state.itemTotals = itemTotals;
    state.empTotals = empTotals;
    state.grandTotal = grandTotal;
    state.period = period;
    state.branch = branch;
    state.missingItems = ITEMS.filter(it => header.allCols[it] === undefined);
    state.missingEmployees = EMPLOYEES.filter(emp => employeeRows[emp].length === 0);

    if (period) document.getElementById('periodText').textContent = period;
    if (branch) document.getElementById('branchText').textContent = branch;
}

}

function render(){

    const tbody = document.querySelector('#reportTable tbody');
    const tfoot = document.querySelector('#reportTable tfoot');
    const emptyEl = document.getElementById('emptyState');
    const tableWrap = document.getElementById('tableWrap');
    const warn = document.getElementById('warnBox');
    const footnote = document.getElementById('footnote');
    const table = document.getElementById('reportTable');

    if (!state.matrix || Object.keys(state.matrix).length === 0){
        emptyEl.innerHTML = EMPTY_HTML_DEFAULT;
        emptyEl.style.display = 'block';
        tableWrap.style.display = 'none';
        warn.style.display = 'none';
        footnote.style.display = 'none';
        return;
    }

    const visibleItems = getVisibleItems();
    if (visibleItems.length === 0){
        emptyEl.innerHTML = '<div class="empty-icon">📋</div><b>لا توجد أصناف بها حركة</b>جميع الأصناف قيمتها صفر. اختر "كل الأصناف" لعرض الجميع.';
        emptyEl.style.display = 'block';
        tableWrap.style.display = 'none';
        warn.style.display = 'none';
        footnote.style.display = 'none';
        return;
    }

    table.classList.toggle('transposed', state.orientation === 'employees-vertical');

    if (state.orientation === 'items-vertical'){
        renderItemsVertical(thead, tbody, tfoot, visibleItems);
    } else {
        renderEmployeesVertical(thead, tbody, tfoot, visibleItems);
    }

    const warnings = [];
    if (state.missingItems.length){
        warnings.push(`<b>أصناف غير موجودة (${state.missingItems.length}):</b> ${state.missingItems.map(esc).join('، ')}`);
    }
    if (state.missingEmployees.length){
        warnings.push(`<b>موظفون غير موجودين (${state.missingEmployees.length}):</b> ${state.missingEmployees.map(esc).join('، ')}`);
    }
    if (warnings.length){
        warn.style.display = 'block';
        warn.innerHTML = warnings.join('<br>');
    } else warn.style.display = 'none';

    const modeNote = state.filterMode === 'active'
        ? 'وضع العرض: <b>الأصناف التي فيها حركة فقط</b>.'
        : 'وضع العرض: <b>كل الأصناف</b>.';
    const oriNote = state.orientation === 'items-vertical'
        ? 'الاتجاه: الأصناف رأسياً × الموظفين أفقياً.'
        : 'الاتجاه: الموظفون رأسياً × الأصناف أفقياً.';
    footnote.innerHTML = `
        الأرقام تمثل عدد الوجبات الجانبية لكل موظف حسب الأصناف المحددة فقط.
        العدد <b>-</b> يعني لا توجد وجبات مسجلة.
        ${modeNote} ${oriNote}`;
    footnote.style.display = 'block';

    document.getElementById('printedText').textContent = 'Printed: ' + dateStamp();
    emptyEl.style.display = 'none';
    tableWrap.style.display = 'block';
}

    tbody.innerHTML = visibleItems.map(item => {
        const rowVals = EMPLOYEES.map(emp => {
            const v = state.matrix[item][emp] || 0;

        }).join('');

    tfoot.innerHTML = `

}

/* =========================================================
   تحميل ملف Excel
   ========================================================= */
async function loadFile(file){
    try{
        const buffer = await file.arrayBuffer();
        const wb = XLSX.read(buffer, { type: 'array' });

        let bestSheet = null;
        for (const sheetName of wb.SheetNames){
            const ws = wb.Sheets[sheetName];
            if (!ws) continue;
            const rows = XLSX.utils.sheet_to_json(ws, {
                header: 1, raw: true, defval: '', blankrows: true
            });
            const header = findHeaderRow(rows);
            if (!bestSheet || header.score > bestSheet.header.score){
                bestSheet = { name: sheetName, rows, header };
            }
            if (header.score === ITEMS.length) break;
        }

        if (!bestSheet || bestSheet.header.score === 0){
            throw new Error('لم يتم العثور على أعمدة الأصناف في أي شيت داخل الملف.');
        }

        buildReport(bestSheet.rows);
        render();

    }catch(err){
        console.error(err);
        alert('تعذر قراءة الملف:\n' + err.message);
    }
}

/* =========================================================
   تصدير PDF — صفحة واحدة
   ========================================================= */
async function exportPDF(){
    if (!state.matrix || Object.keys(state.matrix).length === 0){
        alert('الرجاء تحميل ملف Excel أولاً.');
        return;
    }
    if (getVisibleItems().length === 0){
        alert('لا توجد أصناف للتصدير في وضع "الحركة". اختر "كل الأصناف".');
        return;
    }

    const btn = document.getElementById('btnPdf');
    btn.disabled = true;
    btn.textContent = '⏳ جاري التصدير...';

    const report = document.getElementById('reportArea');
    const wrap = document.getElementById('tableWrap');

    const prev = {
        maxWidth: report.style.maxWidth,
        width: report.style.width,
        overflow: wrap.style.overflow,
        wrapWidth: wrap.style.width
    };

    report.classList.add('pdf-mode');
    report.style.maxWidth = 'none';
    report.style.width = 'max-content';
    wrap.style.overflow = 'visible';
    wrap.style.width = 'auto';

    try{
        await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

        const canvas = await html2canvas(report, {
            scale: 2,
            backgroundColor: '#ffffff',
            useCORS: true,
            allowTaint: true
        });

        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('l', 'pt', 'a4');
        const pdfW = pdf.internal.pageSize.getWidth();
        const pdfH = pdf.internal.pageSize.getHeight();
        const marginPt = 8;
        const usableW = pdfW - 2 * marginPt;
        const usableH = pdfH - 2 * marginPt;

        const scale = Math.min(usableW / canvas.width, usableH / canvas.height);
        const imgW = canvas.width * scale;
        const imgH = canvas.height * scale;
        const x = (pdfW - imgW) / 2;
        const y = (pdfH - imgH) / 2;

        const imgData = canvas.toDataURL('image/jpeg', 0.95);
        pdf.addImage(imgData, 'JPEG', x, y, imgW, imgH);

        pdf.save(`Side_Items_By_Agent_${dateStamp()}.pdf`);

    }catch(err){
        console.error(err);
        alert('حدث خطأ أثناء تصدير PDF:\n' + err.message);
    }finally{
        report.classList.remove('pdf-mode');
        report.style.maxWidth = prev.maxWidth;
        report.style.width = prev.width;
        wrap.style.overflow = prev.overflow;
        wrap.style.width = prev.wrapWidth;
        btn.disabled = false;
        btn.innerHTML = '<span class="btn-emoji">📄</span> PDF';
    }
}

            }), isZero(state.grandTotal) ? '-' : state.grandTotal]
        ];
    } else {
        bodyRows = [
            ['Employee \\ Item', ...visibleItems, 'Total'],
            ...EMPLOYEES.map(emp => [
                emp,
                ...visibleItems.map(it => {
                    const v = state.matrix[it][emp] || 0;
                    return isZero(v) ? '-' : v;
                }),
                isZero(state.empTotals[emp]) ? '-' : (state.empTotals[emp] || 0)
            ]),
            ['Total', ...visibleItems.map(it => {
                const v = state.itemTotals[it] || 0;
                return isZero(v) ? '-' : v;
            }), isZero(state.grandTotal) ? '-' : state.grandTotal]
        ];
    }

    const aoa = [...header, ...bodyRows];
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    if (state.orientation === 'items-vertical'){
        ws['!cols'] = [{ wch: 30 }, ...EMPLOYEES.map(() => ({ wch: 14 })), { wch: 12 }];
    } else {
        ws['!cols'] = [{ wch: 30 }, ...visibleItems.map(() => ({ wch: 12 })), { wch: 12 }];
    }

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'SideItems');
    XLSX.writeFile(wb, `Side_Items_By_Agent_${dateStamp()}.xlsx`);
}

/* =========================================================
   ربط الأحداث
   ========================================================= */
document.getElementById('fileInput').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    if (f) loadFile(f);
});

document.getElementById('btnPdf').addEventListener('click', exportPDF);
document.getElementById('btnXlsx').addEventListener('click', exportXLSX);
document.getElementById('btnOrientation').addEventListener('click', toggleOrientation);

document.querySelectorAll('input[name="itemFilter"]').forEach(inp => {
    inp.addEventListener('change', () => {
        document.querySelectorAll('.segmented label').forEach(l => l.classList.remove('active'));
        inp.closest('label').classList.add('active');
        state.filterMode = inp.value;
        render();
    });
});

document.getElementById('printedText').textContent = 'Printed: ' + dateStamp();

updateOrientationUI();
loadLogo();
</script>
